[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sklearn-stock-trend"
version = "0.1.0"
description = "Stock trend forecasting with scikit-learn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "akshare>=1.12",
    "pandas-ta>=0.4.67b0",
    "pyarrow>=14",
]

[project.scripts]
st-train = "stock_trend.train:main"
st-evaluate = "stock_trend.evaluate:main"
st-backtest = "stock_trend.backtest:main"
st-walkforward = "stock_trend.walkforward:main"
st-multisymbol = "stock_trend.multisymbol:main"
st-experiment = "stock_trend.experiment:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
