symbol: "000001.SZ"
start_date: "2020-01-01"
end_date: "2024-12-31"

label:
  forward_days: 5
  threshold: 0.0

features:
  rsi_window: 14
  ma_windows: [5, 20, 60]
  use_macd: true
  macd:
    fast: 12
    slow: 26
    signal: 9

tuning:
  enabled: true
  cv_mode: purged
  n_splits: 5
  embargo_days: 5
  label_horizon: 5
  scoring: f1_macro
  param_grid:
    max_depth: [4, 6, 8]
    min_samples_leaf: [5, 10]
    n_estimators: [50, 100]

model:
  type: random_forest
  test_size: 0.2
  random_state: 42
  n_estimators: 100
  max_depth: 8
  min_samples_leaf: 10

backtest:
  retail_mode: true
  strategy: long_flat
  signal_mode: probability
  proba_threshold: 0.65
  benchmark: "000300.SH"
  initial_capital: 10000
  lot_size: 100
  min_commission: 5.0
  stamp_tax: 0.0005
  commission_rate: 0.0003
  slippage: 0.0001
  min_holding_days: 1
  save_plot: true

walkforward:
  n_splits: 5
  min_train_size: 200
  tune_per_fold: false

signals:
  export: true

output_dir: outputs/retail_10k/
