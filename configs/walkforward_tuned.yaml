# Walk-forward + 每折 TimeSeriesSplit 调参
symbol: "000001.SZ"
start_date: "2020-01-01"
end_date: "2024-12-31"

label:
  forward_days: 5
  threshold: 0.0

features:
  rsi_window: 14
  ma_windows: [5, 20, 60]
  use_macd: true
  macd:
    fast: 12
    slow: 26
    signal: 9

tuning:
  enabled: true
  n_splits: 3
  scoring: f1_macro
  param_grid:
    max_depth: [4, 6, 8]
    min_samples_leaf: [10, 20]
    n_estimators: [50]

model:
  type: random_forest
  test_size: 0.2
  random_state: 42
  n_estimators: 50
  max_depth: 6
  min_samples_leaf: 10

backtest:
  strategy: long_flat
  signal_mode: probability
  proba_threshold: 0.65
  benchmark: "000300.SH"
  commission_rate: 0.0003
  slippage: 0.0001
  save_plot: true

walkforward:
  n_splits: 4
  min_train_size: 200
  tune_per_fold: true

output_dir: outputs/walkforward_tuned/
